<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Poke Fan — browse the Pokedex, favourite your Pokemon, and organise them into your own groups."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Poke Fan</title>
    <script>
      // Pairs with public/404.html's redirect — restores the originally
      // -requested URL (encoded in ?redirect=) via the History API before
      // the router below ever reads window.location, so a hard reload or
      // direct link on GitHub Pages lands on the right route instead of
      // resetting to "/". A no-op for every normal navigation, since
      // there's no ?redirect= param then.
      (function () {
        var redirect = new URLSearchParams(location.search).get("redirect");
        if (redirect) history.replaceState(null, "", redirect);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
