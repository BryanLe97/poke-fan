name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels any in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # Not a secret — PokeAPI needs no key — but kept out of the
          # source tree as a repo Variable (Settings → Secrets and
          # variables → Actions → Variables) instead of hardcoded, so the
          # endpoint can be swapped without a code change.
          VITE_POKEAPI_BASE_URL: ${{ vars.VITE_POKEAPI_BASE_URL }}
      # test:e2e already built the app to run the E2E suite against (see
      # playwright.config.ts's webServer) — deploy that same dist/ rather
      # than building a second time.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
