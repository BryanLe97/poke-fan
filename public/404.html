<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Poke Fan</title>
    <script>
      // GitHub Pages is a static host — it has no server-side rewrite for
      // client-side routes, so a hard reload or direct link to e.g.
      // /poke-fan/pokemon/pikachu hits this 404 page instead of the app.
      // Redirect back to index.html, carrying the originally-requested
      // path+search+hash as a query param — index.html's own inline
      // script restores it via the History API before the app (and its
      // router) ever mounts, so React Router picks up the right route.
      var target = location.pathname + location.search + location.hash;
      location.replace(
        location.origin + "/poke-fan/?redirect=" + encodeURIComponent(target),
      );
    </script>
  </head>
  <body></body>
</html>
